<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabbed Notes</title>
<style>
:root {
  --bg: var(--sn-stylekit-editor-background-color, var(--sn-stylekit-background-color, #ffffff));
  --fg: var(--sn-stylekit-editor-foreground-color, var(--sn-stylekit-foreground-color, #1f2328));
  --muted: var(--sn-stylekit-neutral-color, #8a8f98);
  --line: var(--sn-stylekit-border-color, #dfe1e5);
  --shelf: var(--sn-stylekit-secondary-background-color, #f3f4f6);
  --accent: var(--sn-stylekit-info-color, #086dd6);
  --font: var(--sn-stylekit-sans-serif-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif);
  --size: var(--sn-stylekit-font-size-editor, 16px);
  --active: #3d6fb4;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: var(--size);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Tab shelf: the one bold element. Each tab carries its own color. */
.shelf {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  padding: 8px 10px 0;
  background: var(--shelf);
  border-bottom: 3px solid var(--active);
  flex-shrink: 0;
}
#tabs {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  overflow-x: auto;
  scrollbar-width: thin;
  min-width: 0;
}
.tab {
  --tab: #3d6fb4;
  position: relative;
  flex-shrink: 0;
  max-width: 14em;
  padding: 6px 14px 5px;
  border: 0;
  border-radius: 7px 7px 0 0;
  background: color-mix(in srgb, var(--tab) 16%, var(--shelf));
  color: var(--fg);
  font: inherit;
  font-size: 0.82em;
  line-height: 1.3;
  cursor: pointer;
  box-shadow: inset 0 3px 0 var(--tab);
  white-space: nowrap;
}
.tab:hover { background: color-mix(in srgb, var(--tab) 26%, var(--shelf)); }
.tab[aria-selected="true"] {
  background: var(--tab);
  color: #fff;
  font-weight: 600;
  padding-bottom: 7px;
  box-shadow: none;
}
.tab-label { display: block; overflow: hidden; text-overflow: ellipsis; }
.tab.dragging { opacity: 0.45; }
.tab:focus-visible, .add:focus-visible, .tool:focus-visible, .menu button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.tab-rename {
  font: inherit;
  font-weight: 600;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 4px;
  min-width: 4ch;
}
.add {
  flex-shrink: 0;
  margin: 0 0 3px 4px;
  width: 28px;
  height: 26px;
  border: 1px dashed var(--muted);
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 1.1em;
  line-height: 1;
  cursor: pointer;
}
.add:hover { color: var(--fg); border-color: var(--fg); }

/* Formatting row, kept quiet */
.toolbar {
  display: flex;
  gap: 2px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  flex-shrink: 0;
}
.toolbar[hidden] { display: none; }
.tool {
  min-width: 30px;
  height: 28px;
  padding: 0 7px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--fg);
  font: inherit;
  font-size: 0.85em;
  cursor: pointer;
  flex-shrink: 0;
}
.tool:hover { background: var(--shelf); }
.sep { width: 1px; margin: 4px 5px; background: var(--line); flex-shrink: 0; }

#page {
  flex: 1;
  overflow-y: auto;
  padding: 18px 24px 48px;
  outline: none;
  line-height: 1.55;
  overflow-wrap: anywhere;
}
#page:empty::before { content: "Start typing…"; color: var(--muted); }
#page > :first-child { margin-top: 0; }
#page h1 { font-size: 1.6em; line-height: 1.25; margin: 0.9em 0 0.4em; }
#page h2 { font-size: 1.3em; line-height: 1.3; margin: 0.9em 0 0.4em; }
#page h3 { font-size: 1.1em; margin: 0.8em 0 0.3em; }
#page p { margin: 0 0 0.55em; }
#page ul, #page ol { padding-left: 1.5em; margin: 0 0 0.6em; }
#page blockquote { margin: 0 0 0.6em; padding-left: 0.9em; border-left: 3px solid var(--active); color: var(--muted); }
#page a { color: var(--accent); }
#page img { max-width: 100%; height: auto; }
#page pre, #page code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; }
#page table { border-collapse: collapse; margin-bottom: 0.6em; }
#page td, #page th { border: 1px solid var(--line); padding: 4px 8px; }

.menu {
  position: fixed;
  z-index: 10;
  min-width: 190px;
  padding: 6px;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  font-size: 0.85em;
}
.menu[hidden] { display: none; }
.menu > button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 6px 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
.menu > button:hover:not(:disabled) { background: var(--shelf); }
.menu > button:disabled { opacity: 0.4; cursor: default; }
.menu .danger { color: var(--sn-stylekit-danger-color, #c62828); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; padding: 6px 8px; }
.swatch {
  width: 18px; height: 18px; padding: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  background: var(--swatch);
  cursor: pointer;
}
.swatch[aria-checked="true"] { border-color: var(--fg); }

.notice {
  margin: 0;
  padding: 6px 12px;
  font-size: 0.8em;
  background: var(--shelf);
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}
.notice[hidden] { display: none; }

@media (max-width: 520px) {
  #page { padding: 14px 14px 40px; }
  .tab { padding: 7px 12px 6px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<p class="notice" id="notice" hidden>Preview only. Changes aren't saved until this editor is installed in Standard Notes.</p>
<div class="shelf">
  <div id="tabs" role="tablist" aria-label="Tabs in this note"></div>
  <button class="add" id="add" type="button" title="Add tab" aria-label="Add tab">+</button>
</div>
<div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
  <button class="tool" type="button" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button class="tool" type="button" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <button class="tool" type="button" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
  <button class="tool" type="button" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
  <span class="sep"></span>
  <button class="tool" type="button" data-cmd="h1" title="Heading">H1</button>
  <button class="tool" type="button" data-cmd="h2" title="Subheading">H2</button>
  <button class="tool" type="button" data-cmd="blockquote" title="Quote">“ ”</button>
  <span class="sep"></span>
  <button class="tool" type="button" data-cmd="insertUnorderedList" title="Bulleted list">• List</button>
  <button class="tool" type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
  <span class="sep"></span>
  <button class="tool" type="button" data-cmd="link" title="Add link">Link</button>
  <button class="tool" type="button" data-cmd="clear" title="Clear formatting">Clear</button>
</div>
<div id="page" role="tabpanel" contenteditable="true" spellcheck="true"></div>
<div class="menu" id="menu" role="menu" hidden>
  <button type="button" role="menuitem" data-act="rename">Rename</button>
  <div class="swatches" role="group" aria-label="Tab color"></div>
  <hr>
  <button type="button" role="menuitem" data-act="left">Move left</button>
  <button type="button" role="menuitem" data-act="right">Move right</button>
  <hr>
  <button type="button" role="menuitem" data-act="delete" class="danger">Delete tab</button>
</div>
